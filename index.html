    <!-- Google Fonts for Pokédex / Sci-Fi HUD aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 select-none antialiased">
    <div id="root"></div>
    <script>
      (function () {
        var ROOT_ID = 'root';
        var RETRY_KEY = 'pokecard_sw_recovery_v1';
        window.setTimeout(function () {
          var root = document.getElementById(ROOT_ID);
          if (root && root.childElementCount === 0 && !sessionStorage.getItem(RETRY_KEY)) {
            sessionStorage.setItem(RETRY_KEY, '1');
            var clean = function () { window.location.reload(); };
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).then(function () {
                if ('caches' in window) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  });
                }
              }).then(clean, clean);
            } else {
              clean();
            }
          }
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
