<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#f87171" stroke-width="8"/>

  <!-- Pokédex Header Plate -->
  <path d="M 32 140 L 220 140 L 270 90 L 480 90 L 480 440 A 56 56 0 0 1 424 496 L 88 496 A 56 56 0 0 1 32 440 Z" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="4"/>

  <!-- Glowing Pokédex Lens -->
  <circle cx="100" cy="80" r="48" fill="#0f172a" stroke="#ffffff" stroke-width="6"/>
  <circle cx="100" cy="80" r="40" fill="url(#lensGlow)" filter="url(#glow)"/>
  <circle cx="86" cy="68" r="14" fill="#ffffff" fill-opacity="0.7"/>

  <!-- Small LED lights -->
  <circle cx="170" cy="65" r="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <circle cx="205" cy="65" r="12" fill="#eab308" stroke="#713f12" stroke-width="2"/>
  <circle cx="240" cy="65" r="12" fill="#22c55e" stroke="#14532d" stroke-width="2"/>

  <!-- Central Pokéball Emblem -->
  <g transform="translate(256, 310)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="110" fill="#020617" stroke="#38bdf8" stroke-width="8" filter="url(#glow)"/>
    <!-- Top red half -->
    <path d="M -100 0 A 100 100 0 0 1 100 0 Z" fill="#ef4444"/>
    <!-- Bottom white half -->
    <path d="M -100 0 A 100 100 0 0 0 100 0 Z" fill="#f8fafc"/>
    <!-- Center divider band -->
    <rect x="-100" y="-12" width="200" height="24" fill="#0f172a"/>
    <!-- Center Outer Button -->
    <circle cx="0" cy="0" r="34" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <!-- Center Inner Button -->
    <circle cx="0" cy="0" r="20" fill="#ffffff"/>
    <circle cx="0" cy="0" r="12" fill="#38bdf8"/>
  </g>

  <!-- Futuristic Corner Highlights -->
  <line x1="320" y1="120" x2="450" y2="120" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="380" y1="135" x2="450" y2="135" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
